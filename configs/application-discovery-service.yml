server:
  port: 8761

management:
  endpoints:
    web:
      exposure:
        include: "*"

spring:
  application:
    name: discovery-service

eureka:
  instance:
    prefer-ip-address: true
    ip-address: ${HOSTNAME}
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    wait-time-in-ms-when-sync-empty: 0